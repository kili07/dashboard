<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- interactive-widget: die Tastatur verkleinert das Layout, statt sich über
     das Sheet zu legen — sonst verschwindet das Eingabefeld unter ihr. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0e14">
<meta name="description" content="Startseite für Deine selbstgebauten Web-Apps">
<title>Meine Apps</title>
<script>
/* Aussehen setzen, bevor das Stylesheet greift — sonst blitzt beim Start kurz
   das Standard-Theme auf und die Kacheln springen in ihre Größe. Eigene,
   winzige Schlüssel: den kompletten Datensatz hier zu parsen würde den Start
   bremsen. app.js hält beide synchron. */
(function () {
  var root = document.documentElement;
  try {
    var t = localStorage.getItem('dashboard.theme') || 'auto';
    if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    root.dataset.theme = t;
    var look = JSON.parse(localStorage.getItem('dashboard.look') || 'null');
    if (look) {
      ['layout', 'size', 'shape', 'labels', 'font'].forEach(function (k) {
        if (look[k]) root.dataset[k] = look[k];
      });
      if (look.accent) root.style.setProperty('--accent', look.accent);
      if (look.onAccent) root.style.setProperty('--on-accent', look.onAccent);
    }
  } catch (e) { /* privater Modus o.ä. — dann bleibt es beim Standard */ }
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar" id="topbar">
  <h1 id="title">Meine Apps</h1>
  <div class="top-actions">
    <button class="icon-btn" id="btnEdit" aria-label="Bearbeiten" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>
      </svg>
    </button>
    <button class="link strong hidden" id="btnDone">Fertig</button>
    <button class="icon-btn" id="btnAdd" aria-label="App hinzufügen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
    <button class="icon-btn" id="btnSettings" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
        <path d="M18.89 9.89L21.42 10.17L21.42 13.83L18.89 14.11L18.36 15.38L19.96 17.37L17.37 19.96L15.38 18.36L14.11 18.89L13.83 21.42L10.17 21.42L9.89 18.89L8.62 18.36L6.63 19.96L4.04 17.37L5.64 15.38L5.11 14.11L2.58 13.83L2.58 10.17L5.11 9.89L5.64 8.62L4.04 6.63L6.63 4.04L8.62 5.64L9.89 5.11L10.17 2.58L13.83 2.58L14.11 5.11L15.38 5.64L17.37 4.04L19.96 6.63L18.36 8.62Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
</header>

<main id="main">
  <!-- Hinweise: werden beim Start gefüllt, bevor der erste Frame gemalt wird -->
  <div id="notices"></div>

  <div class="search hidden" id="searchWrap">
    <input class="inp" id="search" type="search" placeholder="Suchen" aria-label="Apps durchsuchen"
           autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
  </div>

  <p class="edit-help hidden" id="editHelp">Tippen zum Bearbeiten · halten und ziehen zum Sortieren<span class="sr-only">,
    mit der Tastatur: Umschalt und Pfeiltasten</span></p>

  <div class="grid" id="grid" aria-label="Apps"></div>
</main>

<!-- Sheet: trägt alle Formulare und Dialoge -->
<div class="scrim hidden" id="scrim"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <button class="link" id="sheetCancel">Abbrechen</button>
    <strong id="sheetTitle"></strong>
    <button class="link strong" id="sheetSave">Sichern</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="update-bar hidden" id="updateBar" role="status">
  <span>Neue Version verfügbar</span>
  <button class="link strong" id="btnReload">Neu laden</button>
</div>

<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
